<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rymdäventyret – Klockkul</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d2b;color:white;font-family:system-ui,sans-serif;text-align:center}main{max-width:680px;margin:auto;padding:14px}a{color:#b5eaff;text-decoration:none;display:block;text-align:left;margin:5px 0 12px}h1{font-size:clamp(1.7rem,6vw,2.7rem);margin:8px}p{color:#d7ddff}.hud{display:flex;justify-content:space-around;background:#202957;border-radius:18px;padding:12px;font-weight:800}.space{height:340px;position:relative;overflow:hidden;border-radius:24px;margin:14px 0;background:radial-gradient(circle at 75% 20%,#513b89,transparent 35%),linear-gradient(#101c4e,#05091c)}.star{position:absolute;color:#ffe99a;animation:twinkle 1.5s infinite alternate}@keyframes twinkle{to{opacity:.2;transform:scale(.6)}}.rocket{position:absolute;left:50%;top:82%;font-size:60px;transform:translate(-50%,-50%) rotate(-45deg);transition:left .45s,top .45s;z-index:4;filter:drop-shadow(0 0 14px #56bfff)}.planet{position:absolute;left:50%;top:5%;font-size:65px;transform:translateX(-50%)}.hole{position:absolute;left:50%;top:5%;font-size:75px;transform:translateX(-50%)}.question{background:#263369;border-radius:20px;padding:14px;margin:10px 0}.question h2{margin:4px;font-size:1.25rem}.clock{width:140px;height:140px;border:8px solid #f6f2ff;border-radius:50%;background:#fffdf0;position:relative;margin:10px auto;color:#1d2040}.num{position:absolute;left:50%;top:50%;font-weight:800;font-size:12px;transform:translate(-50%,-50%) rotate(var(--a)) translateY(-53px) rotate(calc(-1 * var(--a)))}.hand{position:absolute;left:50%;bottom:50%;transform-origin:bottom;border-radius:8px}.hour{width:6px;height:36px;background:#7651db}.minute{width:4px;height:49px;background:#159eaa}.dot{position:absolute;top:50%;left:50%;width:12px;height:12px;background:#21223d;border-radius:50%;transform:translate(-50%,-50%)}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}button{cursor:pointer;border:0;border-radius:18px;padding:17px 7px;font-size:1.12rem;font-weight:900;background:#ffe178;color:#25204c;min-height:68px;box-shadow:0 5px #b78c2d}button:disabled{opacity:.6}button.correct{background:#8df1ba}button.wrong{background:#ff9fa5}.level button{font-size:.85rem;min-height:42px;padding:8px;background:#d9d2ff;box-shadow:none}.level button.active{background:#ffe178}.level{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.message{min-height:50px;font-weight:800;font-size:1.15rem}#next{background:#9cefff;box-shadow:0 5px #4f92a7;width:100%;margin:4px 0 18px}#next[hidden]{display:none}.rocket.fly{left:78%;top:72%}.rocket.fail{left:50%;top:80%;filter:grayscale(1) drop-shadow(0 0 18px #ff4e66)}.obstacle{position:absolute;top:0;left:50%;transform:translate(-50%,-50%) scale(.3);font-size:65px;z-index:3;will-change:top,transform}.space:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 32%,#ffffff14 33%,transparent 34%,transparent 65%,#ffffff14 66%,transparent 67%);pointer-events:none}.timer{height:12px;border-radius:20px;background:#ffffff30;overflow:hidden;margin:12px 0}.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#65eac2,#ffe178);transform-origin:left}.speednote{font-size:.9rem;color:#d7ddff}.options button{touch-action:manipulation}@media(max-width:380px){.options button{font-size:.96rem}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main><a href="index.html">← Tillbaka till Klockkul</a><h1>🚀 Rymdäventyret</h1><p>Välj rätt tid och flyg förbi svarta hål!</p><div class="level" id="levels"></div><div class="hud"><span>⭐ <b id="points">0</b></span><span>🪐 Planet <b id="planet">1</b></span><span>🔥 <b id="streak">0</b> i rad</span></div><div class="space" id="space"><div class="rocket" id="rocket">🚀</div><div id="destination" class="planet">🪐</div><div class="obstacle" id="obstacle">🕳️</div></div><div class="question"><h2 id="prompt"></h2><div id="clock"></div></div><div class="timer" aria-label="Tid kvar"><i id="timerbar"></i></div><div class="speednote" id="speednote"></div><div class="options" id="options"></div><div class="message" id="message" role="status" aria-live="polite"></div><button id="next" hidden>Flyg vidare! 🚀</button></main><script>
const steps=[30,15,5,1],names=['🌱 Lätt','🌟 Mellan','🚀 Svår','👑 Expert'],durations=[22000,15000,10000,6500];
let level=0,points=+(localStorage.spacePoints||0),round=0,streak=0,answer=null,locked=false,frame=0,deadline=0,remaining=0;
const $=s=>document.querySelector(s),num=n=>String(n).padStart(2,'0'),fmt=t=>num(t.h)+':'+num(t.m);
const words=['tolv','ett','två','tre','fyra','fem','sex','sju','åtta','nio','tio','elva'];
const random=()=>({h:1+Math.floor(Math.random()*12),m:Math.floor(Math.random()*(60/steps[level]))*steps[level]});
const say=t=>{let h=words[t.h%12],next=words[(t.h+1)%12],m=t.m;if(!m)return 'Klockan '+h;if(m===15)return 'Kvart över '+h;if(m===30)return 'Halv '+next;if(m===45)return 'Kvart i '+next;if(m<30)return m+' minuter över '+h;return (60-m)+' minuter i '+next};
names.forEach((name,i)=>{let b=document.createElement('button');b.textContent=name;b.onclick=()=>{cancelAnimationFrame(frame);level=i;round=0;streak=0;document.querySelectorAll('.level button').forEach(x=>x.classList.remove('active'));b.classList.add('active');newRound()};if(!i)b.className='active';$('#levels').append(b)});
for(let i=0;i<32;i++){let star=document.createElement('span');star.className='star';star.textContent='✦';star.style.left=Math.random()*100+'%';star.style.top=Math.random()*100+'%';star.style.animationDelay=Math.random()*2+'s';$('#space').prepend(star)}
function clock(t){let c=document.createElement('div');c.className='clock';for(let n=1;n<=12;n++){let el=document.createElement('span');el.className='num';el.textContent=n;el.style.setProperty('--a',n*30+'deg');c.append(el)}for(let [cls,deg] of [['hour',t.h*30+t.m*.5],['minute',t.m*6]]){let hand=document.createElement('i');hand.className='hand '+cls;hand.style.transform='translateX(-50%) rotate('+deg+'deg)';c.append(hand)}let d=document.createElement('i');d.className='dot';c.append(d);return c}
function tick(now){if(locked)return;let fraction=Math.max(0,(deadline-now)/durations[level]);$('#timerbar').style.transform='scaleX('+fraction+')';let progress=1-fraction;$('#obstacle').style.top=(7+progress*77)+'%';$('#obstacle').style.transform='translate(-50%,-50%) scale('+(0.35+progress*1.15)+')';if(fraction<=0){finish(false,null,true);return}frame=requestAnimationFrame(tick)}
function newRound(){cancelAnimationFrame(frame);locked=false;$('#next').hidden=true;$('#message').textContent='';$('#rocket').className='rocket';$('#obstacle').textContent=['🕳️','☄️','🪨'][Math.floor(Math.random()*3)];$('#destination').textContent='🪐';$('#clock').replaceChildren();$('#options').replaceChildren();answer=random();let analog=Math.random()<.5;$('#prompt').textContent=analog?'Vilken tid visar klockan?':'Hitta rätt tid: '+say(answer);if(analog)$('#clock').append(clock(answer));let choices=[answer],used=new Set([fmt(answer)]);while(choices.length<3){let t=random();if(!used.has(fmt(t))){used.add(fmt(t));choices.push(t)}}for(let t of choices.sort(()=>Math.random()-.5)){let b=document.createElement('button');b.textContent=fmt(t);b.onclick=()=>finish(fmt(t)===fmt(answer),b,false);$('#options').append(b)}$('#planet').textContent=1+Math.floor(round/5);$('#points').textContent=points;$('#streak').textContent=streak;$('#speednote').textContent=['🐢 Lugnt tempo – ta din tid!','🛸 Lite snabbare!','⚡ Se upp, det går fort!','🔥 Supersnabbt – reagera direkt!'][level];$('#obstacle').style.top='7%';$('#obstacle').style.transform='translate(-50%,-50%) scale(.35)';$('#timerbar').style.transform='scaleX(1)';deadline=performance.now()+durations[level];frame=requestAnimationFrame(tick)}
function finish(ok,button,timeout){if(locked)return;locked=true;cancelAnimationFrame(frame);document.querySelectorAll('#options button').forEach(x=>x.disabled=true);if(ok){button.classList.add('correct');streak++;round++;points++;localStorage.spacePoints=points;localStorage.clockStars=+(localStorage.clockStars||0)+1;localStorage.clockCorrect=+(localStorage.clockCorrect||0)+1;$('#rocket').classList.add('fly');$('#message').textContent=round%5===0?'🏆 Ny planet! Du är en rymdhjälte!':'✨ Snygg undanmanöver! +1 ⭐'}else{if(button)button.classList.add('wrong');streak=0;$('#rocket').classList.add('fail');$('#obstacle').style.top='78%';$('#obstacle').style.transform='translate(-50%,-50%) scale(1.5)';$('#message').textContent=(timeout?'⏰ Tiden tog slut! ':'🛟 Oj, ett hinder! ')+'Rätt svar: '+fmt(answer);document.querySelectorAll('#options button').forEach(x=>{if(x.textContent===fmt(answer))x.classList.add('correct')})}$('#points').textContent=points;$('#streak').textContent=streak;$('#next').textContent=ok?'Flyg vidare! 🚀':'Försök igen! 💪';$('#next').hidden=false}
$('#next').onclick=newRound;document.addEventListener('visibilitychange',()=>{if(document.hidden&&!locked){cancelAnimationFrame(frame);remaining=Math.max(0,deadline-performance.now())}else if(!document.hidden&&!locked){deadline=performance.now()+remaining;frame=requestAnimationFrame(tick)}});newRound();
</script></body></html>
